image: room.pgm
# meters per pixel (adjust based on your design)
resolution: 0.05 #0.01  
#0.01 too high for a 6ft x 10ft room apparently
origin: [0.0, 0.0, 0.0]  # Starting pose (x, y, yaw in radians)
occupied_thresh: 0.65    # Pixels darker than this are obstacles
free_thresh: 0.25        # Pixels lighter than this are free space
negate: 0                # 0 = no inversion, 1 = invert colors